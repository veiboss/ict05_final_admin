events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ==========================================
  # Admin 서버 (toastlabadmin.duckdns.org)
  # ==========================================

  # HTTP -> HTTPS 리다이렉트 (Admin)
  server {
    listen 80;
    server_name toastlabadmin.duckdns.org;

    # Let's Encrypt 인증용
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS (Admin)
  server {
    listen 443 ssl http2;
    server_name toastlabadmin.duckdns.org;

    # SSL 설정
    ssl_certificate /etc/letsencrypt/live/toastlabadmin.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toastlabadmin.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Admin 앱 프록시
    location / {
      proxy_pass http://admin-app:8081;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;

      proxy_redirect off;
    }
  }

  # ==========================================
  # User 서버 (toastlab.duckdns.org)
  # ==========================================

  # HTTP -> HTTPS 리다이렉트 (User)
  server {
    listen 80;
    server_name toastlab.duckdns.org;

    # Let's Encrypt 인증용
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS (User)
  server {
    listen 443 ssl http2;
    server_name toastlab.duckdns.org;

    # SSL 설정
    ssl_certificate /etc/letsencrypt/live/toastlab.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toastlab.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # /user 리다이렉트
    location = /user {
      return 301 $scheme://$host/user/;
    }

    # 스프링 API 프록시
    location /user/api/ {
      proxy_pass http://user-app:8082/user/api/;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }

    # 리액트 SPA
    location /user/ {
      try_files $uri $uri/ /user/index.html;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}