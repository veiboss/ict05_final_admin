<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>HQ 회원가입</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="login-logo">📝</div>
        <h1 class="login-title">HQ 회원가입</h1>
        <p class="login-subtitle">본사 계정을 생성하세요</p>

        <form th:action="@{/join-submit}" method="post" th:object="${form}" style="margin-top:8px;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <label class="login-label">이메일</label>
            <input class="login-input" type="email" th:field="*{email}" required>
            <div class="login-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <label class="login-label">이름</label>
            <input class="login-input" type="text" th:field="*{name}" required>
            <div class="login-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

            <label class="login-label">비밀번호</label>
            <input class="login-input" type="password" th:field="*{password}" required>
            <div class="login-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

            <div class="login-error" th:if="${dupError}" th:text="${dupError}"></div>

            <button type="submit" class="login-btn-primary">회원가입</button>
            <a th:href="@{/login}" class="login-btn-secondary" style="display:block;text-align:center;">로그인으로</a>
        </form>
    </div>
</div>
</body>
</html>
