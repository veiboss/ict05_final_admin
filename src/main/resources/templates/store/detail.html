<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="robots" content="noindex">
    <meta name="googlebot" content="noindex">
    <title>토스트랩 관리자</title>

    <th:block th:replace="~{fragments/head :: commonHead}"></th:block>

    <!-- favicon -->
    <link rel="icon" th:href="@{/images/logo/favi_ad.png}" type="image/x-icon"/>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/toast.css}" />

    <!-- JS -->
    <script th:src="@{/js/lib/jquery-3.2.1.min.js}"></script>
    <script th:src="@{/js/toast.js}"></script>
</head>
<body class="scroll-up">
<div id="wrap" class="frame">
    <div th:replace="~{fragments/header :: header}"></div>

    <div id="container" class="container">
        <div class="title-bar">
            <h2 class="page-title ellipsis">가맹점 상세</h2>
        </div>

        <main id="content" class="max-900">
            <div class="box-wrap">
                    <div class="pack-down gap-20">
                        <h3 class="fs-2xl fw-600 fc-333" th:text="${store.name}">가맹점명</h3>

                        <div class="row col-3">
                            <div class="pack-down col">
                                <span class="fs-ss fc-999">ID</span>
                                <span th:text="${store.id}">ID</span>
                            </div>
                            <div class="pack-down col">
                                <span class="fs-ss fc-999">점주명</span>
                                <span th:text="${staffName != null ? staffName : '미지정'}">점주명</span>
                            </div>
                           <!-- <div class="pack-down col">
                                <span class="fs-ss fc-999">본사 담당자명</span>
                                <span th:text="${store.memberId != null ? store.memberId : '미지정'}">본사 담당자</span>
                            </div>-->
                        </div>
                    </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
