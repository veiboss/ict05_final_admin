    <div id="container" class="container">
        <div class="title-bar">
            <h2 class="page-title ellipsis">
                사원 등록
            </h2>
        </div>

        <main id="content">
            <div class="write-form box-wrap">
                <form name="inputform" id="inputform" th:object="${staffAddFormDTO}">
                    <fieldset>
                        <legend class="blind">기본 정보</legend>
                        <div class="row-2">
                            <div class="field col">
                                <label class="label medium required" for="staffName">이름</label>
                                <div class="insert">
                                    <input th:field="*{staffName}" type="text" id="staffName" class="input-text medium" title="이름" placeholder="홍길동">
                                </div>
                            </div>
                            <div class="field col">
                                <label class="label medium required" for="staffEmail">이메일</label>
                                <div class="insert">
                                    <input th:field="*{staffEmail}" type="text" id="staffEmail" class="input-text medium" title="이메일" placeholder="hong@email.com">
                                </div>
                            </div>
                        </div>
                        <div class="row-3">
                            <div class="field col">
                                <label class="label medium required">근무지 (선택)</label>
                                <div class="input-wrap" style="position:relative;">
                                    <input id="storeSearch" class="input-text medium"
                                           placeholder="매장명 입력(선택)" list="storeList" autocomplete="off">
                                    <input type="hidden" id="storeIdFk" th:field="*{storeIdFk}">
                                    <datalist id="storeList">
                                        <option th:each="s : ${stores}"
                                                th:value="${s.name}"
                                                th:attr="data-id=${s.id}"></option>
                                    </datalist>
                                    <small id="storeHint" style="display:none;color:#ef4444;">목록에서 선택되지 않았습니다 (선택 항목).</small>
                                </div>
                            </div>
                            <div class="field col">
                                <label class="label medium" for="staffDepartment">부서</label>
                                <div class="insert">
                                    <select id="staffDepartment" class="select medium" th:field="*{staffDepartment}">
                                        <option value="" >선택</option>
                                        <option th:each="c : ${StaffDepartment}" th:value="${c.name()}" th:text="${c.description}">팀</option>
                                    </select>
                                </div>
                            </div>
                            <div class="field col">
                                <label class="label medium" for="staffEmploymentType">근무 형태</label>
                                <div class="insert">
                                    <select id="staffEmploymentType" class="select medium" th:field="*{staffEmploymentType}">
                                        <option value="" >선택</option>
                                        <option th:each="c : ${StaffEmploymentType}" th:value="${c.name()}" th:text="${c.description}">형태</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row-2">
                            <div class="field col">
                                <label class="label medium required" for="staffPhone">연락처</label>
                                <div class="insert">
                                    <input th:field="*{staffPhone}" type="text" id="staffPhone" class="input-text medium" title="연락처" placeholder="010-1234-1234">
                                </div>
                            </div>
                            <div class="field col">
                                <label class="label medium required" for="staffBirth">생년월일</label>
                                <div class="insert">
                                    <input th:field="*{staffBirth}" type="date" id="staffBirth" class="input-text medium" title="생년월일">
                                </div>
                            </div>
                        </div>
                        <div class="row-3">
                            <div class="field col">
                                <label class="label medium required" for="userAddress1">주소</label>
                                <input type="button" class="btn small color1" id="addressSearch" style="margin-left:10px" value="주소 검색" onclick="findAddr()">
                                <div class="insert">
                                    <input th:field="*{userAddress1}" id="userAddress1" type="text" class="input-text medium" size="50" placeholder="주소를 검색해주세요" readonly >
                                </div>
                                <div class="insert">
                                    <input th:field="*{userAddress2}" type="text" class="input-text medium" size="50" placeholder="나머지 주소 작성" required>
                                </div>
                            </div>
                        </div>
                        <div class="row-3">
                            <div class="field col">
                                <label class="label medium required" for="staffStartDate">입사일자</label>
                                <div class="insert">
                                    <input th:field="*{staffStartDate}" type="date" id="staffStartDate" class="input-text medium" title="입사일자">
                                </div>
                            </div>
                            <div class="field col">
                                <label class="label medium required" for="staffEndDate">퇴사일자</label>
                                <div class="insert">
                                    <input th:field="*{staffEndDate}" type="date" id="staffEndDate" class="input-text medium" title="퇴사일자">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="field">
                                <span class="label medium">인풋</span>
                                <label class="insert pack-left">
                                    <input type="file" class="input-text medium">
                                </label>
                            </div>
                        </div>

                        <div class="button-area pack-center">
                            <button type="submit" class="btn large color1">저장</button>
                            <a href="/admin/staff/list" class="btn large bdr-color1">목록</a>
                        </div>
                    </fieldset>
                </form>
            </div><!--.write-form -->
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div><!-- // #container  -->
</div><!-- // #wrap  -->

<script>
    document.getElementById("inputform").addEventListener("submit", function(e) {
        e.preventDefault();

        const formData = new FormData(this); // 폼의 모든 input 포함

        fetch("/admin/API/staff/add", {
            method: "POST",
            body: formData
        })
            .then(async response => {
                const data = await response.json();
                if (!response.ok) {
                    if (response.status === 400 && data.errors) {
                        Object.keys(data.errors).forEach(field => {
                            const errorMsg = data.errors[field];
                            const errorElement = document.getElementById(field + 'Error');
                            if (errorElement) errorElement.textContent = errorMsg;
                        });
                    }
                    throw new Error("서버 검증 오류");
                } else {
                    if (data.success) {
                        alert('저장 완료!');
                        window.location.href = '/admin/staff/list';
                    }
                }
            })
            .catch(error => {
                console.error("에러 발생:", error);
            });
    });

(function(){
  const input  = document.getElementById('storeSearch');
  const hidden = document.getElementById('storeIdFk');
  const list   = document.getElementById('storeList');
  const hint   = document.getElementById('storeHint');

  const opts = () => Array.from(list.options || []);

  function sync(){
    const val = (input.value || '').trim();
    const exact = opts().find(o => o.value === val);
    hidden.value = exact ? (exact.getAttribute('data-id') || '') : '';
    // 필수 아님: 입력이 있지만 매칭이 없을 때만 힌트 표시, 제출은 막지 않음
    hint.style.display = (val && !hidden.value) ? 'inline' : 'none';
  }

  input.addEventListener('input',  sync);
  input.addEventListener('change', sync);
  input.addEventListener('blur',   sync);

  const form = input.closest('form');
  if (form) {
    form.addEventListener('submit', () => {
      // null 허용 → 막지 않음
      // 필요하면 여기서 hidden.value==='' && input.value!=='' 인 경우 confirm 띄우기 정도만.
    });
  }
})();

</script>
