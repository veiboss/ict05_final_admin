<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="googlebot" content="noindex">
    <!-- Bootstrap CSS CDN -->
    <th:block th:replace="~{fragments/head :: commonHead}"></th:block>

    <link href="/admin/css/toast.css" rel="stylesheet"/>
    <script src="/admin/js/lib/jquery-3.2.1.min.js"></script>
    <script src="/admin/js/toast.js"></script>
</head>
<body>
<div id="wrap" class="frame">
    <div th:replace="~{fragments/header :: header}"></div>

    <div id="container" class="container">
        <div class="title-bar">
            <h2 class="page-title ellipsis max-900">
                <span th:text="${material.name}">재료명</span>
                <span class="fw-400">본사 재고 내역</span>
            </h2>
        </div>

        <main id="content" class="max-900">
            <input type="hidden" id="inventoryId" th:value="${inventory.id}">
            <input type="hidden" id="materialId" th:value="${material.id}">
            <!-- 사용중지 경고 -->
            <div th:if="${material.materialStatus.name() == 'STOP'}"
                 class="alert alert-warning mb-3">
                본사에서 <strong>사용중지된 재료</strong>입니다.
            </div>
            <div class="box-wrap">
                <div class="row-4">
                    <div class="pack-down col">
                        <span class="fs-ss fc-999">상태</span>
                        <span>
                            <span th:class="|badge rounded-pill ${inventory.status.name() == 'SUFFICIENT' ? 'bg-success' : (inventory.status.name() == 'LOW' ? 'bg-warning' : 'bg-danger') }|"
                                  th:text="${inventory.status.description}">
                            </span>
                        </span>
                    </div>
                    <div class="pack-down col-2">
                        <span class="fs-ss fc-999">현재 수량</span>
                        <span class="pack-left mo-pack-down">
                            <span th:text="${inventory.quantity}">현재 수량</span>
                            <span th:text="${material.salesUnit}" class="fs-ss fc-999">기본단위</span>

                            <!-- 수량 조정 -->
                            <span id="adjustForm" style="display:none;">
                                <span class="pack-left">
                                    <input type="number" step="1"
                                           id="newQty" name="quantityAfter"
                                           class="input-text small fc-000" style="width: 60px;"
                                           th:value="${inventory.quantity}">
                                    <button type="button" class="btn small color1" id="confirmBtn">확인</button>
                                    <button type="button" class="btn small bdr-color1" id="cancelBtn">취소</button>
                                </span>
                            </span>

                            <!-- 수정 버튼 -->
                            <button type="button" class="btn xsmall bdr-color1" id="adjustBtn" style="margin-left:6px;">수정</button>
                        </span>
                    </div>
                    <div class="pack-down col">
                        <span class="fs-ss fc-999">적정 수량</span>
                        <span class="pack-left">
                            <span th:text="${inventory.optimalQuantity}">적정 수량</span>
                            <span th:text="${material.salesUnit}" class="fs-ss fc-999">기본단위</span>
                            <a th:href="@{/material/modify/{id}(id=${material.id})}" class="btn xsmall bdr-color1">재료수정</a>
                        </span>
                    </div>
                </div>

                <hr class="line bg-000">

                <section class="pack-down">
                    <!-- 검색 영역 -->
                    <div id="search" class="search">
                        <form id="filterForm" method="get">
                            <fieldset>
                                <legend class="blind">검색</legend>
                                <div class="pack-both">
                                    <!-- 입출고 타입 선택 -->
                                    <div class="select-options r4">
                                        <label>
                                            <input type="radio" name="type" value=""
                                                   th:checked="${selectedType == null or selectedType == ''}">
                                            <span class="btn medium r4">전체</span>
                                        </label>

                                        <label>
                                            <input type="radio" name="type" value="INCOME"
                                                   th:checked="${selectedType == 'INCOME'}">
                                            <span class="btn medium r4">입고</span>
                                        </label>

                                        <label>
                                            <input type="radio" name="type" value="OUTGO"
                                                   th:checked="${selectedType == 'OUTGO'}">
                                            <span class="btn medium r4">출고</span>
                                        </label>

                                        <label>
                                            <input type="radio" name="type" value="ADJUST"
                                                   th:checked="${selectedType == 'ADJUST'}">
                                            <span class="btn medium r4">조정</span>
                                        </label>
                                    </div>

                                    <div class="pack-left">
                                        <!-- 기간 필터 -->
                                        <div class="pack-left">
                                            <input type="date" name="start"
                                                   title="시작일" class="input-text medium"
                                                   style="width: 112px;"
                                                   th:value="${startDate}">
                                            <span>~</span>
                                            <input type="date" name="end"
                                                   title="종료일"
                                                   class="input-text medium"
                                                   style="width: 112px;"
                                                   th:value="${endDate}">
                                        </div>

                                        <!-- 검색 버튼 -->
                                        <div class="pack-left">
                                            <button type="submit" class="btn medium color1">검색</button>
                                        </div>
                                    </div>
                                </div>
                            </fieldset>
                        </form>
                    </div>

                    <table class="data-table">
                        <thead>
                        <tr>
                            <th scope="col">날짜</th>
                            <th scope="col">구분</th>
                            <th scope="col">수량</th>
                            <th scope="col">재고</th>
                            <th scope="col">가맹점</th>
                            <th scope="col">단가</th>
                            <th scope="col">비고</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(logs.content)}">
                            <td colspan="7">입출고 내역이 없습니다.</td>
                        </tr>
                        <tr th:each="log : ${logs.content}">
                            <td th:text="${#temporals.format(log.date, 'yyyy-MM-dd')}"></td>
                            <td>
                                <span th:switch="${log.type}">
                                    <span th:case="'INCOME'" class="type-in">입고</span>
                                    <span th:case="'OUTGO'" class="type-out">출고</span>
                                    <span th:case="'ADJUST'" class="type-adj">조정</span>
                                  </span>
                            </td>
                            <td th:text="${log.quantity}"></td>
                            <td th:text="${log.stockAfter}"></td>
                            <td th:text="${log.storeId != null ? log.storeId : '-'}"></td>
                            <td th:text="${log.unitPrice}"></td>
                            <td th:text="${log.memo ?: '-'}"></td>
                        </tr>
                        </tbody>
                    </table>

                    <div style="text-align:center;">
                        <div th:replace="~{fragments/pagination :: pagination (${logs})}"></div>
                    </div>
                </section>
            </div><!--//.box-wrap-->
            <div class="button-area pack-both">
                <a href="/admin/inventory/list" class="btn medium color1">목록</a>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div><!-- // #container  -->
</div><!--#wrap.frame-->
<script>
    // 라디오 선택 시 자동 검색
    document.querySelectorAll("input[name='type']").forEach(radio => {
      radio.addEventListener("change", () => {
        document.getElementById("filterForm").submit();
      });
    });

    const btn = document.getElementById("adjustBtn");
    const form = document.getElementById("adjustForm");
    const cancel = document.getElementById("cancelBtn");
    const confirm = document.getElementById("confirmBtn");

    btn.addEventListener("click", () => {
        btn.style.display = "none";
        form.style.display = "inline";
    });

    cancel.addEventListener("click", () => {
        form.style.display = "none";
        btn.style.display = "inline";
    });

    confirm.addEventListener("click", () => {
        const newQty = Number(document.getElementById("newQty").value);
        const memo = prompt("조정 사유를 입력하세요:", "");
        if (memo === null) return; // 취소 시 중단

        const inventoryId = document.getElementById("inventoryId").value;

        fetch(`/admin/API/inventory/adjust`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                inventoryId: inventoryId,
                quantityAfter: newQty,
                memo: memo || "",              // 비고 입력
                reason: "MANUAL"               // 기본값
            })
        })
        .then(async r => {
                if (!r.ok) throw new Error(await r.text());
                return r.json();
        })
        .then(data => {
            if (data.success) location.reload();
            else alert("조정 실패");
        })
        .catch(err => {
            console.error("요청 실패:", err);
            alert("요청 실패");
        });
    });
</script>
</body>
</html>
