<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="googlebot" content="noindex">
    <!-- Bootstrap CSS CDN -->
    <th:block th:replace="~{fragments/head :: commonHead}"></th:block>

    <link href="/admin/css/toast.css" rel="stylesheet"/>
    <script src="/admin/js/lib/jquery-3.2.1.min.js"></script>
    <script src="/admin/js/toast.js"></script>
</head>
<body>
<div id="wrap" class="frame">
    <div th:replace="~{fragments/header :: header}"></div>

    <div id="container" class="container" th:data-material-id="${materialId}">
        <div class="title-bar">
            <h2 class="page-title ellipsis max-1132">
                <span th:text="${materialName}">재료명</span>
                <span class="fw-400">본사 재고 로그</span>
            </h2>
        </div>

        <main id="content" class="max-1132">
            <input type="hidden" id="materialId" th:value="${materialId}"/>

            <div class="box-wrap">

                <!-- 검색 영역 -->
                <section class="pack-down">
                    <div id="search" class="search">
                        <form id="filterForm" onsubmit="return false;">
                            <fieldset>
                                <legend class="blind">검색</legend>
                                <div class="pack-both">
                                    <!-- 타입 라디오 -->
                                    <div class="select-options r4">
                                        <label>
                                            <input type="radio" name="type" value="" th:checked="${selectedType == null or selectedType == ''}">
                                            <span class="btn medium r4">전체</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="type" value="INCOME" th:checked="${selectedType == 'INCOME'}">
                                            <span class="btn medium r4">입고</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="type" value="OUTGO"  th:checked="${selectedType == 'OUTGO'}">
                                            <span class="btn medium r4">출고</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="type" value="ADJUST" th:checked="${selectedType == 'ADJUST'}">
                                            <span class="btn medium r4">조정</span>
                                        </label>
                                    </div>

                                    <div class="pack-left">
                                        <!-- 기간 -->
                                        <div class="pack-left">
                                            <input type="date" id="startDate" th:value="${startDate}" class="input-text medium" style="width:112px;">
                                            <span>~</span>
                                            <input type="date" id="endDate" th:value="${endDate}" class="input-text medium" style="width:112px;">
                                        </div>

                                        <!-- 버튼 -->
                                        <div class="pack-left">
                                            <button type="button" id="btnSearch" class="btn medium color1">검색</button>
                                            <button type="button" id="btnToday" class="btn medium">오늘</button>
                                            <button type="button" id="btn7d" class="btn medium">7일</button>
                                            <button type="button" id="btn30d" class="btn medium">30일</button>
                                            <button type="button" id="btnExcel" class="btn medium bdr-color1">엑셀</button>
                                        </div>
                                    </div>
                                </div>
                            </fieldset>
                        </form>
                    </div>
                </section>

                <!-- 목록 -->
                <section class="pack-down">
                    <table class="data-table" id="logTable">
                        <thead>
                        <tr>
                            <th scope="col">날짜</th>
                            <th scope="col">구분</th>
                            <th scope="col">수량</th>
                            <th scope="col">재고</th>
                            <th scope="col">가맹점</th>
                            <th scope="col">단가</th>
                            <th scope="col">비고</th>
                        </tr>
                        </thead>
                        <tbody id="logTbody">
                        <tr id="emptyRow" style="display:none;">
                            <td colspan="7">입출고 내역이 없습니다.</td>
                        </tr>

                        <tr th:each="row : ${logs.content}">
                            <td th:text="${#temporals.format(row.date, 'yyyy-MM-dd HH:mm:ss')}"></td>
                            <td>
                                <span th:switch="${row.type}">
                                  <span th:case="'INCOME'" class="type-in">입고</span>
                                  <span th:case="'OUTGO'"  class="type-out">출고</span>
                                  <span th:case="'ADJUST'" class="type-adj">조정</span>
                                  <span th:case="*">-</span>
                                </span>
                            </td>
                            <td th:text="${row.quantity}"></td>
                            <td th:text="${row.stockAfter}"></td>
                            <td th:text="${row.storeId != null ? row.storeId : '-'}"></td>
                            <td th:text="${row.unitPrice}"></td>
                            <td th:text="${row.memo != null && row.memo != '' ? row.memo : '-'}"></td>
                        </tr>
                        </tbody>
                    </table>

                    <!-- 페이징 -->
                    <div class="button-area pack-center" style="margin-top:12px;">
                        <button type="button" id="btnPrev" class="btn small">이전</button>
                        <span id="pageInfo" class="pack-left" style="padding:8px 12px;"></span>
                        <button type="button" id="btnNext" class="btn small">다음</button>
                    </div>
                </section>

            </div>

            <div class="button-area pack-both">
                <a href="/admin/inventory/list" class="btn medium color1">목록</a>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script>
    (function () {
      const $container = $('#container');
      const materialId = Number($container.data('material-id'));

      const $tbody   = $('#logTbody');
      const $empty   = $('#emptyRow');
      const $pageInfo = $('#pageInfo');

      let state = { page: 0, size: 10, totalPages: 0 };

      // 유틸
      function fmtDateTime(s) {
        if (!s) return '';
        return String(s).replace('T', ' ').substring(0, 19);
      }
      function fmtNum(n) {
        if (n == null) return '';
        return Number(n).toLocaleString(undefined, { maximumFractionDigits: 3 });
      }
      function badge(type) {
        if (type === 'INCOME') return '<span class="type-in">입고</span>';
        if (type === 'OUTGO')  return '<span class="type-out">출고</span>';
        if (type === 'ADJUST') return '<span class="type-adj">조정</span>';
        return type || '';
      }

      // 폼 값 읽기
      function readFilter() {
        const type = $('input[name="type"]:checked').val() || '';
        const start = $('#startDate').val() || '';
        const end = $('#endDate').val() || '';
        return { type, start, end };
      }

      // 조회
      function loadLogs(resetPage) {
        if (resetPage) state.page = 0;
        const { type, start, end } = readFilter();

        const params = new URLSearchParams();
        params.set('materialId', String(materialId));
        if (type) params.set('type', type);
        if (start) params.set('startDate', start);
        if (end) params.set('endDate', end);
        params.set('page', String(state.page));
        params.set('size', String(state.size));

        fetch('/inventory/logs?' + params.toString())
          .then(r => r.ok ? r.json() : Promise.reject(r))
          .then(page => {
            renderRows(page);
            state.totalPages = page.totalPages || 0;
            $pageInfo.text((page.number + 1) + ' / ' + (page.totalPages || 0));
          })
          .catch(err => {
            $tbody.empty().append($empty.show());
            toast.error('로그 조회 실패: ' + (err.status || err));
          });
      }

      function renderRows(page){
          const rows = (page && page.content) ? page.content : [];
          $tbody.find('tr:not(#emptyRow)').remove();
          if (!rows.length){
            $empty.show();
            return;
          }
          $empty.hide();
          rows.forEach(log => {
            const tr = $('<tr/>')
              .append($('<td/>').text(fmtDateTime(log.date)))
              .append($('<td/>').html(badge(log.type)))
              .append($('<td/>').addClass('text-right').text(fmtNum(log.quantity)))
              .append($('<td/>').addClass('text-right').text(fmtNum(log.stockAfter)))
              .append($('<td/>').text(log.storeId != null ? log.storeId : '-')))
              .append($('<td/>').addClass('text-right').text(fmtNum(log.unitPrice)))
              .append($('<td/>').text(log.memo ? log.memo : '-'));
            $tbody.append(tr);
          });
        }

      // 퀵필터
      function setQuick(days) {
        const today = new Date();
        const end = today.toISOString().slice(0, 10);
        const from = new Date(today.getTime() - (days - 1) * 86400000);
        const start = from.toISOString().slice(0, 10);
        $('#startDate').val(start);
        $('#endDate').val(end);
      }

      // 이벤트
      $('#btnSearch').on('click', () => loadLogs(true));
      $('input[name="type"]').on('change', () => loadLogs(true));
      $('#btnToday').on('click', () => { setQuick(1); loadLogs(true); });
      $('#btn7d').on('click', () => { setQuick(7); loadLogs(true); });
      $('#btn30d').on('click', () => { setQuick(30); loadLogs(true); });

      $('#btnPrev').on('click', () => {
        if (state.page > 0) { state.page -= 1; loadLogs(false); }
      });
      $('#btnNext').on('click', () => {
        if (state.page + 1 < state.totalPages) { state.page += 1; loadLogs(false); }
      });

      // 엑셀
      $('#btnExcel').on('click', () => {
        const { type, start, end } = readFilter();
        const params = new URLSearchParams();
        params.set('materialId', String(materialId));
        if (type) params.set('type', type);
        if (start) params.set('from', start + 'T00:00:00');
        if (end) params.set('to', end + 'T23:59:59');
        window.location.href = '/API/inventory/logs/excel?' + params.toString();
      });

      // 초기 로드
      loadLogs(true);
    })();
</script>
</body>
</html>
