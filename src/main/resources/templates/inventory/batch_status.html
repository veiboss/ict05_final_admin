<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="googlebot" content="noindex">
    <!-- Bootstrap CSS CDN -->
    <th:block th:replace="~{fragments/head :: commonHead}"></th:block>

    <link href="/admin/css/toast.css" rel="stylesheet"/>
    <script src="/admin/js/lib/jquery-3.2.1.min.js"></script>
    <script src="/admin/js/toast.js"></script>
    <script src="/admin/js/excel-download.js" defer></script>
</head>
<body>
<div id="wrap" class="frame">
    <div th:replace="~{fragments/header :: header}"></div>

    <div id="container" class="container" th:data-material-id="${materialId}">
        <div class="title-bar">
            <h2 class="page-title ellipsis max-1132">
                <span class="fw-400">로트별 재고 현황</span>
            </h2>
        </div>

        <main id="content" class="max-1132">

            <div class="box-wrap">
                <div class="list-header pack-both">
                    <div class="pack-left">
                    </div>

                    <div class="pack-left">
                        <button type="button" class="btn medium bdr-color2"
                                th:attr="data-excel-endpoint=@{'/API/inventory/' + ${materialId} + '/batch/download'}"
                                onclick="excelDownload(this)">엑셀다운로드</button>
                    </div>
                </div>
                <section class="pack-down">
                    <table class="data-table" id="batchTable">
                        <thead>
                        <tr>
                            <th scope="col">로트 번호</th>
                            <th scope="col">입고 수량</th>
                            <th scope="col">현재 수량</th>
                            <th scope="col">유통 기한</th>
                            <th scope="col">입고일</th>
                            <th scope="col">단가</th>
                        </tr>
                        </thead>
                        <tbody id="batchTbody">
                        <tr th:each="b: ${batches}">
                            <td th:text="${b.lotNo}"></td>
                            <td th:text="${#temporals.format(b.receivedDate,'yyyy-MM-dd HH:mm')}"></td>
                            <td th:text="${b.expirationDate != null ? #temporals.format(b.expirationDate,'yyyy-MM-dd') : '-'}"></td>
                            <td th:text="${#numbers.formatDecimal(b.receivedQuantity,1,'COMMA',3,'POINT')}"></td>
                            <td th:text="${#numbers.formatDecimal(b.quantity,1,'COMMA',3,'POINT')}"></td>
                            <td th:text="${b.store != null ? b.store.name : '본사'}"></td>
                        </tr>
                        </tbody>
                    </table>
                </section>
            </div><!--//.box-wrap-->
            <div class="button-area pack-both">
                <a href="/admin/inventory/list" class="btn medium color1">목록</a>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div><!-- // #container  -->
</div><!--#wrap.frame-->

<script>
</script>
</body>
</html>
