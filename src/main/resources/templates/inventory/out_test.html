<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="googlebot" content="noindex">
    <!-- Bootstrap CSS CDN -->
    <th:block th:replace="~{fragments/head :: commonHead}"></th:block>

    <link href="/admin/css/toast.css" rel="stylesheet"/>
    <script src="/admin/js/lib/jquery-3.2.1.min.js"></script>
    <script src="/admin/js/toast.js"></script>
</head>
<body>
<div id="wrap" class="frame">
    <div th:replace="~{fragments/header :: header}"></div>

    <div id="container" class="container">
        <div class="title-bar">
            <h2 class="page-title ellipsis max-1132">
                <span class="fw-400">본사 출고 테스트</span>
            </h2>
        </div>

        <main id="content" class="max-1132">
            <div class="box-wrap">
                <section class="pack-down">
                    <form id="outForm" class="pack-down gap-20" onsubmit="return false;">
                        <div class="grid gap-12" style="grid-template-columns: repeat(2, 1fr);">
                            <label class="pack-down gap-4">
                                <span>재료 ID</span>
                                <input type="number" class="input-text large" id="materialId" value="42" min="1">
                            </label>

                            <label class="pack-down gap-4">
                                <span>총 출고 수량</span>
                                <input type="number" class="input-text large" id="qty" value="10" step="0.001" min="0">
                            </label>

                            <label class="pack-down gap-4">
                                <span>가맹점 ID(선택)</span>
                                <input type="number" class="input-text large" id="storeId" placeholder="예: 3" min="1">
                            </label>

                            <label class="pack-down gap-4">
                                <span>비고</span>
                                <input type="text" class="input-text large" id="memo" value="테스트 출고">
                            </label>
                        </div>

                        <div class="button-area pack-both" style="margin-top:12px;">
                            <button type="button" id="btnPreview" class="btn large color1">미리보기(FIFO)</button>
                            <button type="button" id="btnConfirm" class="btn large color2" disabled>출고 확정</button>
                        </div>
                    </form>
                </section>

                <section class="pack-down">
                    <h3 class="fw-500" style="margin-bottom:8px;">배치 분할 미리보기</h3>
                    <table class="data-table" id="previewTable">
                        <thead>
                        <tr>
                            <th scope="col">로트 번호</th>
                            <th scope="col">배치 ID</th>
                            <th scope="col">출고 수량</th>
                            <th scope="col">유통기한</th>
                        </tr>
                        </thead>
                        <tbody id="previewTbody">
                        <tr id="previewEmpty"><td colspan="4">미리보기 결과가 없습니다.</td></tr>
                        </tbody>
                        <tfoot>
                        <tr>
                            <th colspan="2" class="text-right">합계</th>
                            <th class="text-right" id="sumQty">0</th>
                            <th></th>
                        </tr>
                        </tfoot>
                    </table>
                </section>
            </div>

            <div class="button-area pack-both">
                <a href="/admin/inventory/list" class="btn medium color1">목록</a>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script>
    (function () {
      const $btnPreview = $('#btnPreview');
      const $btnConfirm = $('#btnConfirm');
      const $tbody = $('#previewTbody');
      const $empty = $('#previewEmpty');
      const $sumQty = $('#sumQty');

      let lastPreview = []; // OutPreviewItemDTO[]

      function fmtDate(d) {
        if (!d) return '';
        // LocalDate 문자열 가정: 2025-11-05
        return String(d).substring(0, 10);
      }
      function fmtNum(n) {
        if (n == null) return '';
        return Number(n).toLocaleString(undefined, { maximumFractionDigits: 3 });
      }

      function readInputs() {
        const materialId = Number($('#materialId').val());
        const qty = Number($('#qty').val());
        const storeIdRaw = $('#storeId').val();
        const storeId = storeIdRaw ? Number(storeIdRaw) : null;
        const memo = $('#memo').val() || null;
        return { materialId, qty, storeId, memo };
      }

      function renderPreview(rows) {
        $tbody.empty();
        if (!rows || rows.length === 0) {
          $tbody.append($empty.show());
          $sumQty.text('0');
          $btnConfirm.prop('disabled', true);
          return;
        }
        let total = 0;
        rows.forEach(r => {
          total += Number(r.qty);
          const tr = $('<tr/>')
            .append($('<td/>').text(r.lotNo))
            .append($('<td/>').text(r.batchId))
            .append($('<td/>').addClass('text-right').text(fmtNum(r.qty)))
            .append($('<td/>').text(fmtDate(r.expirationDate)));
          $tbody.append(tr);
        });
        $sumQty.text(fmtNum(total));
        $btnConfirm.prop('disabled', false);
      }

      // 미리보기
      $btnPreview.on('click', function () {
        const { materialId, qty } = readInputs();
        if (!materialId || !qty || qty <= 0) {
          toast.warn('재료 ID와 수량을 확인하세요.');
          return;
        }

        // POST x-www-form-urlencoded
        const body = new URLSearchParams();
        body.set('materialId', String(materialId));
        body.set('qty', String(qty));

        fetch('/API/inventory/out/preview', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
          body
        })
          .then(r => r.ok ? r.json() : Promise.reject(r))
          .then(rows => {
            lastPreview = rows || [];
            renderPreview(lastPreview);
            toast.success('미리보기 완료');
          })
          .catch(err => {
            lastPreview = [];
            renderPreview([]);
            toast.error('미리보기 실패: ' + (err.status || err));
          });
      });

      // 확정
      $btnConfirm.on('click', function () {
        const { materialId, qty, storeId, memo } = readInputs();
        if (!materialId || !qty || qty <= 0) {
          toast.warn('재료 ID와 수량을 확인하세요.');
          return;
        }
        if (!lastPreview || lastPreview.length === 0) {
          toast.warn('먼저 미리보기를 수행하세요.');
          return;
        }

        const payload = {
          materialId: materialId,
          storeId: storeId,            // null 가능
          totalQty: qty,               // BigDecimal
          outDate: null,               // 서버에서 now() 처리
          memo: memo
        };

        fetch('/API/inventory/out/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json;charset=UTF-8' },
          body: JSON.stringify(payload)
        })
          .then(r => r.ok ? r.json() : Promise.reject(r))
          .then(id => {
            toast.success('출고 확정 완료. ID=' + id);
            // 확정 후 미리보기 초기화
            lastPreview = [];
            renderPreview([]);
          })
          .catch(err => toast.error('출고 확정 실패: ' + (err.status || err)));
      });
    })();
</script>
</body>
</html>
