<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="robots" content="noindex">
    <meta name="googlebot" content="noindex">
    <title>토스트랩 관리자</title>
    <link href="/admin/css/toast.css" rel="stylesheet"/>
    <script src="/admin/js/lib/jquery-3.2.1.min.js"></script>
    <script src="/admin/js/toast.js"></script>
</head>
<body>
<div id="wrap" class="frame">
    <div th:replace="~{fragments/header :: header}"></div>
    <div id="container" class="container">
        <div class="title-bar">
            <h2 class="page-title ellipsis">공지사항 관리</h2>
        </div>

        <main id="content">
            <div class="box-wrap">
            <div id="search" class="search">
                <form name="frm" id="frm" method="get">
                    <fieldset>
                        <legend class="blind">검색</legend>
                        <div class="pack-left">
                            <input type="hidden" name="type" th:value="${noticeSearchDTO.type}" />
                            <input type="hidden" name="size" th:value="${noticeSearchDTO.size}" />
                            <div class="field insert">
                                <select name="type" class="select medium" title="검색조건" id="searchSel">
                                    <option value="" th:selected="${noticeSearchDTO.type == null or noticeSearchDTO.type == ''}">선택</option>
                                    <option value="title" th:selected="${noticeSearchDTO.type == 'title'}">제목</option>
                                    <option value="content" th:selected="${noticeSearchDTO.type == 'content'}">내용</option>
                                    <option value="all" th:selected="${noticeSearchDTO.type == 'all'}">제목 + 내용</option>
                                    <option value="writer" th:selected="${noticeSearchDTO.type == 'writer'}">작성자</option>
                                </select>
                            </div>
                            <div class="field insert">
                                <input type="text" name="s" id="searchTxt" class="input-text medium" title="검색어" placeholder="검색어를 입력해 주세요" />
                            </div>
                            <div class="button-area pack-left">
                                <button type="submit" class="btn medium color1">검색</button>
                                <button type="reset" class="btn medium bdr-color1">초기화</button>
                            </div>
                        </div>
                        <div class="pack-left">
                            <!-- 상태 필터 -->
                            <div class="btn medium bdr-color1 btn-group btn-group-toggle" data-bs-toggle="buttons">
                                <label class="btn medium"
                                       th:classappend="${materialSearchDTO.status == null or materialSearchDTO.status == ''} ? ' active' : ''">
                                    <input type="radio" name="status" value=""
                                           th:checked="${materialSearchDTO.status == null}"
                                           onclick="setFilter('')">전체
                                </label>

                                <label class="btn medium"
                                       th:classappend="${materialSearchDTO.status?.name() == 'USE'} ? ' active' : ''">
                                    <input type="radio" name="status" value="USE"
                                           th:checked="${materialSearchDTO.status?.name() == 'USE'}"
                                           onclick="setFilter('USE')">사용중
                                </label>

                                <label class="btn medium"
                                       th:classappend="${materialSearchDTO.status?.name() == 'STOP'} ? ' active' : ''">
                                    <input type="radio" name="status" value="STOP"
                                           th:checked="${materialSearchDTO.status?.name() == 'STOP'}"
                                           onclick="setFilter('STOP')">중단
                                </label>
                            </div>

                            <!-- 페이지 사이즈 -->
                            <div class="pack-left page-size">
                                <select title="뷰사이즈" th:field="${noticeSearchDTO.size}" class="select medium"
                                        onchange="setPageSize(this.value)">
                                    <option value="10">10개씩 보기</option>
                                    <option value="30">30개씩 보기</option>
                                    <option value="50">50개씩 보기</option>
                                    <option value="100">100개씩 보기</option>
                                </select>
                            </div>
                        </div>
                    </fieldset>
                </form>
            </div>

            <section class="box-wrap">
                <div class="list-header pack-both">
                    <div class="pack-left">
                        <a href="/admin/notice/write" class="btn medium color2">공지등록</a>
                    </div>
                    <div class="pack-left">
                        <button type="button" class="btn medium bdr-color1" onclick="excelDownload()">엑셀다운로드</button>
                    </div>
                </div>

                <table class="data-table">
                    <thead>
                    <tr>
                        <th scope="col">번호</th>
                        <th scope="col">유형</th>
                        <th scope="col">카테고리</th>
                        <th scope="col">제목</th>
                        <th scope="col">작성자</th>
                        <th scope="col">작성일</th>
                        <th scope="col">조회수</th>
                        <th scope="col">상태</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="notice, stat : ${notices.content}">
                        <td th:text="${notices.totalElements - (notices.number * notices.size) - stat.index}">1</td>
                        <td th:text="${notice.getNoticePriorityLabel}">우선순위</td>
                        <td th:text="${notice.getNoticeCategoryLabel}">카테고리</td>
                        <td><a th:href="@{/notice/detail/{id}(id=${notice.id})}" th:text="${notice.title}">제목</a></td>
                        <td th:text="${notice.writer}">작성자</td>
                        <td th:text="${notice.getWriteDate}">00.00.00</td>
                        <td th:text="${notice.noticeCount != null ? notice.noticeCount : 0}">조회수</td>
                        <td th:text="${notice.getNoticeStatusLabel}">상태</td>
                    </tr>
                    </tbody>
                </table>
                <div style="text-align: center;">
                    <div th:replace="~{fragments/pagination :: pagination (${notices})}"></div>
                </div>
            </section>
            </div>
        </main>


        <div th:replace="~{fragments/footer :: footer}"></div>
    </div><!-- // #container  -->
</div><!--#wrap.frame-->
<script>
    function setFilter(status) {
      const params = new URLSearchParams(window.location.search);

      if (status === '') {
        params.set("status", '');
      } else {
        params.set("status", status);
      }

      const query = params.toString();
      window.location = `/admin/notice/list?${query}`;
    }


    function setPageSize(size) {
        const params = new URLSearchParams(window.location.search);
        params.set('size', size);
        params.set('page', 1);
        window.location = `/admin/notice/list?${params.toString()}`;
    }
</script>
<script>
    function excelDownload() {
        const formData = new FormData(document.getElementById('frm'));
        const type = formData.get("type");
        const s = formData.get("s");
        window.location = `/admin/API/notice/download?type=${encodeURIComponent(type)}&s=${encodeURIComponent(s)}`;
    }
</script>
</body>
</html>
