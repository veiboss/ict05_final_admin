<!-- src/main/resources/templates/analytics/materials.html -->
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <th:block th:replace="~{fragments/head :: commonHead}"></th:block>

  <link href="/admin/css/toast.css" rel="stylesheet"/>
  <script src="/admin/js/lib/jquery-3.2.1.min.js"></script>
  <script src="/admin/js/toast.js"></script>
</head>
<body>
<div id="wrap" class="frame">
  <div th:replace="~{fragments/header :: header}"></div>

  <div id="container" class="container">
    <div class="title-bar">
      <h2 class="page-title ellipsis">재료 분석</h2>
    </div>

    <section id="mat-cards" class="cards grid-4 gap">
      <div class="card"><div class="k">본사 재고</div><div id="mc-hq" class="v ta-r">0</div></div>
      <div class="card"><div class="k">가맹 재고</div><div id="mc-store" class="v ta-r">0</div></div>
      <div class="card"><div class="k">YTD 발주/소진</div>
        <div class="v ta-r"><span id="mc-order">0</span> / <span id="mc-cons">0</span></div>
      </div>
      <div class="card"><div class="k">회전율</div><div id="mc-turn" class="v ta-r">0</div></div>
    </section>
    <section class="cards grid-3 gap">
      <div class="card"><div class="k">매출</div><div id="mc-sales" class="v ta-r">0</div></div>
      <div class="card"><div class="k">원가(COGS)</div><div id="mc-cogs" class="v ta-r">0</div></div>
      <div class="card"><div class="k">이익 / 마진율</div>
        <div class="v ta-r"><span id="mc-profit">0</span> / <span id="mc-margin">0%</span></div>
      </div>
    </section>


    <main id="content">
      <div class="box-wrap">

        <div id="search" class="search">
          <form id="frm" onsubmit="return false;">
            <fieldset>
              <legend class="blind">검색</legend>
              <div class="pack-both">
                <div class="pack-left">
                  <input type="text" name="storeIds" class="input-text medium form-control"
                         placeholder="가맹점 ID들(쉼표)"/>
                </div>

                <div class="pack-left">
                  <input type="date" name="startDate" class="input-text medium form-control"
                         th:value="${#temporals.format(search.startDate, 'yyyy-MM-dd')}"/>
                  <input type="date" name="endDate" class="input-text medium form-control"
                         th:value="${#temporals.format(search.endDate, 'yyyy-MM-dd')}"/>

                  <div class="btn medium bdr-color1 btn-group btn-group-toggle" data-bs-toggle="buttons">
                    <label class="btn medium active">
                      <input type="radio" name="viewBy" value="DAY" checked>일별
                    </label>
                    <label class="btn medium">
                      <input type="radio" name="viewBy" value="MONTH">월별
                    </label>
                  </div>

                  <div class="pack-left page-size">
                    <select title="출력개수" name="limit" class="select medium">
                      <option>20</option><option selected>40</option><option>60</option>
                      <option>80</option><option>100</option><option>200</option>
                    </select>
                    <span class="fs-ss">개씩 보기</span>
                  </div>

                  <button type="button" class="btn medium color1" onclick="fetchData()">조회</button>
                </div>
              </div>
            </fieldset>
          </form>
        </div>

        <section class="pack-down">
          <table class="data-table" id="tbl">
            <thead>
            <tr>
              <th>Store</th>
              <th>재료명</th>
              <th>매장 보유 재고</th>
              <th>주문량</th>
              <th>회전율</th>
              <th>매출액</th>
              <th>이익금</th>
              <th>마진율</th>
            </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </div>
</div>

<script>
  function fmtN(v){return (v??0).toLocaleString();}
  function fmtPct(v){return (v==null)?'0%':Number(v).toFixed(1)+'%';}
  function fetchMaterialCards(){
    const storeIds = new FormData(document.getElementById('frm')).get('storeIds');
    const qs = storeIds ? ('?storeIds='+encodeURIComponent(storeIds)) : '';
    fetch('/admin/API/analytics/materials/cards'+qs)
      .then(r=>r.json()).then(c=>{
        const nz = v => v ?? 0;
        document.getElementById('mc-hq').textContent     = fmtN(nz(c.hqStockQtyNow));
        document.getElementById('mc-store').textContent  = fmtN(nz(c.storeStockQtyNow));
        document.getElementById('mc-order').textContent  = fmtN(nz(c.orderQtyYtd));
        document.getElementById('mc-cons').textContent   = fmtN(nz(c.consumptionQtyYtd));
        document.getElementById('mc-turn').textContent   = (nz(c.turnover)).toFixed ? nz(c.turnover).toFixed(2) : c.turnover;
        document.getElementById('mc-sales').textContent  = fmtN(nz(c.salesAmountYtd));
        document.getElementById('mc-cogs').textContent   = fmtN(nz(c.cogsYtd));
        document.getElementById('mc-profit').textContent = fmtN(nz(c.profit));
        document.getElementById('mc-margin').textContent = fmtPct(nz(c.marginRate));
      }).catch(()=>toast('카드 요약 조회 중 오류가 발생했습니다.'));
  }
  document.addEventListener('DOMContentLoaded', ()=>{
    fetchMaterialCards();
    fetchData();
  });
</script>


<script>
  function params() {
    const fd = new FormData(document.getElementById('frm'));
    const p = new URLSearchParams();
    for (const [k, v] of fd.entries()) if (v) p.append(k, v);
    return p.toString();
  }
  function fetchData() {
    fetch('/admin/API/analytics/materials?' + params())
      .then(r => r.json())
      .then(rows => {
        const tbody = document.querySelector('#tbl tbody');
        tbody.innerHTML = '';
        rows.forEach(r => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${r.storeName ?? ''}</td>
            <td>${r.materialName ?? ''}</td>
            <td class="ta-r">${r.storeStock ?? 0}</td>
            <td class="ta-r">${r.orderQty ?? 0}</td>
            <td class="ta-r">${r.turnover ?? 0}</td>
            <td class="ta-r">${r.salesAmount ?? 0}</td>
            <td class="ta-r">${r.profit ?? 0}</td>
            <td class="ta-r">${r.marginRate ?? 0}</td>`;
          tbody.appendChild(tr);
        });
      }).catch(() => toast('데이터 조회 중 오류가 발생했습니다.'));
  }
  document.addEventListener('DOMContentLoaded', fetchData);
</script>
</body>
</html>
