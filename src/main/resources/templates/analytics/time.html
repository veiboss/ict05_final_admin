<!-- src/main/resources/templates/analytics/time.html -->
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <th:block th:replace="~{fragments/head :: commonHead}"></th:block>

  <link href="/admin/css/toast.css" rel="stylesheet"/>
  <script src="/admin/js/lib/jquery-3.2.1.min.js"></script>
  <script src="/admin/js/toast.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .chart-card{background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.06);padding:12px}
  </style>
</head>
<body>
<div id="wrap" class="frame">
  <div th:replace="~{fragments/header :: header}"></div>

  <div id="container" class="container">
    <div class="title-bar">
      <h2 class="page-title ellipsis">시간·요일 분석</h2>
    </div>

    <main id="content">
      <div class="box-wrap">

        <!-- YTD 누적 차트 2개 -->
        <section class="pack-down" style="background:#e9f2f5;padding:16px;border-radius:8px;margin-bottom:12px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div class="chart-card">
              <div class="fs-ss" style="margin-bottom:6px;">YTD 시간대별 매출</div>
              <canvas id="chartYtdHour" height="140"></canvas>
            </div>
            <div class="chart-card">
              <div class="fs-ss" style="margin-bottom:6px;">YTD 요일별 매출</div>
              <canvas id="chartYtdDow" height="140"></canvas>
            </div>
          </div>
        </section>

        <!-- 필터 -->
        <div id="search" class="search">
          <form id="frm" onsubmit="return false;">
            <fieldset>
              <legend class="blind">검색</legend>
              <div class="pack-both">
                <div class="pack-left">
                  <input type="text" name="storeIds" class="input-text medium form-control"
                         placeholder="가맹점 ID들(쉼표)"/>
                </div>

                <div class="pack-left">
                  <input type="date" name="startDate" class="input-text medium form-control"
                         th:value="${#temporals.format(search.startDate, 'yyyy-MM-dd')}"/>
                  <input type="date" name="endDate" class="input-text medium form-control"
                         th:value="${#temporals.format(search.endDate, 'yyyy-MM-dd')}"/>

                  <div class="btn medium bdr-color1 btn-group btn-group-toggle" data-bs-toggle="buttons">
                    <label class="btn medium active">
                      <input type="radio" name="viewBy" value="DAY" checked>일별
                    </label>
                    <label class="btn medium">
                      <input type="radio" name="viewBy" value="MONTH">월별
                    </label>
                  </div>

                  <div class="pack-left page-size">
                    <select title="출력개수" name="limit" class="select medium">
                      <option>20</option><option selected>40</option><option>60</option>
                      <option>80</option><option>100</option><option>200</option>
                    </select>
                    <span class="fs-ss">개씩 보기</span>
                  </div>

                  <button type="button" class="btn medium color1" onclick="fetchAll()">조회</button>
                </div>
              </div>
            </fieldset>
          </form>
        </div>

        <!-- 필터 적용 차트 2개 -->
        <section class="pack-down" style="background:#f7f9fb;padding:12px 16px;border-radius:8px;">
          <div class="fs-ss" style="margin-bottom:8px;">선택한 기간·가맹점 기준</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div class="chart-card">
              <div class="fs-ss" style="margin-bottom:6px;">시간대별 매출(필터적용)</div>
              <canvas id="chartFilHour" height="160"></canvas>
            </div>
            <div class="chart-card">
              <div class="fs-ss" style="margin-bottom:6px;">요일별 매출(필터적용)</div>
              <canvas id="chartFilDow" height="160"></canvas>
            </div>
          </div>
        </section>

        <!-- 표 -->
        <section class="pack-down">
          <table class="data-table" id="tbl">
            <thead>
            <tr>
              <th>Store</th>
              <th>시간대</th>
              <th>요일</th>
              <th>주문ID</th>
              <th class="ta-r">주문금액</th>
              <th>카테고리</th>
              <th>메뉴</th>
              <th>OrderType</th>
              <th>OrderDate</th>
            </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </div>
</div>

<script>
  function params() {
    const fd = new FormData(document.getElementById('frm'));
    const p = new URLSearchParams();
    for (const [k, v] of fd.entries()) if (v) p.append(k, v);
    if (p.get('storeIds') && p.get('storeIds').includes(',')) {
      const raw = p.get('storeIds'); p.delete('storeIds');
      raw.split(',').map(x => x.trim()).filter(Boolean).forEach(id => p.append('storeIds', id));
    }
    return p.toString();
  }

  function renderLine(ctx, labels, series) {
    const datasets = series.map(s => ({label: s.name, data: s.data}));
    if (ctx.chart) ctx.chart.destroy();
    ctx.chart = new Chart(ctx, { type: 'line', data: {labels, datasets}, options: {responsive:true, maintainAspectRatio:false}});
    return ctx.chart;
  }
  function renderBar(ctx, labels, series) {
    const datasets = series.map(s => ({label: s.name, data: s.data}));
    if (ctx.chart) ctx.chart.destroy();
    ctx.chart = new Chart(ctx, { type: 'bar', data: {labels, datasets}, options: {responsive:true, maintainAspectRatio:false}});
    return ctx.chart;
  }

  function loadYtdCharts() {
    fetch('/admin/API/analytics/time/summary')
      .then(r => r.json())
      .then(dto => {
        renderLine(document.getElementById('chartYtdHour').getContext('2d'), dto.hours, dto.timeOfDay);
        renderBar (document.getElementById('chartYtdDow' ).getContext('2d'), dto.dows , dto.dayOfWeek);
      })
      .catch(() => toast('YTD 차트 로딩 실패'));
  }

  function fetchAll() {
    const q = params();

    fetch('/admin/API/analytics/time?' + q)
      .then(r => r.json())
      .then(rows => {
        const tbody = document.querySelector('#tbl tbody');
        tbody.innerHTML = '';
        rows.forEach(r => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${r.storeName ?? ''}</td>
            <td>${r.hourSlot ?? ''}</td>
            <td>${r.dayOfWeek ?? ''}</td>
            <td class="ta-r">${r.orderId ?? ''}</td>
            <td class="ta-r">${(r.orderAmount ?? 0).toLocaleString()}</td>
            <td>${r.category ?? ''}</td>
            <td>${r.menu ?? ''}</td>
            <td>${r.orderType ?? ''}</td>
            <td>${r.orderDate ?? ''}</td>`;
          tbody.appendChild(tr);
        });
      })
      .catch(() => toast('표 데이터 조회 실패'));

    fetch('/admin/API/analytics/time/series?' + q)
      .then(r => r.json())
      .then(dto => {
        renderLine(document.getElementById('chartFilHour').getContext('2d'), dto.hours, dto.timeOfDay);
        renderBar (document.getElementById('chartFilDow' ).getContext('2d'), dto.dows , dto.dayOfWeek);
      })
      .catch(() => toast('필터 차트 조회 실패'));
  }

  document.addEventListener('DOMContentLoaded', function(){
    loadYtdCharts();
    fetchAll();
  });
</script>
</body>
</html>
