<!-- src/main/resources/templates/analytics/kpi.html -->
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <th:block th:replace="~{fragments/head :: commonHead}"></th:block>

  <link href="/admin/css/toast.css" rel="stylesheet"/>
  <script src="/admin/js/lib/jquery-3.2.1.min.js"></script>
  <script src="/admin/js/toast.js"></script>
</head>
<body>
<div id="wrap" class="frame">
  <div th:replace="~{fragments/header :: header}"></div>

  <div id="container" class="container">
    <div class="title-bar">
      <h2 class="page-title ellipsis">KPI 분석</h2>
    </div>

    <main id="content">
      <div th:each="c : ${kpiCards}">
        <div class="row-4">
          <div class="col box-wrap">
            <div class="title">Sales</div>
            <div class="card"
                 th:text="|${#numbers.formatDecimal(c.sales, 0, 'COMMA', 0, 'POINT')} 원|">0 원</div>
            <span class="hint">올해 누적</span>
          </div>
          <div class="col box-wrap">
            <div class="title">Transaction</div>
            <div class="card"
                 th:text="|${#numbers.formatDecimal(c.transaction, 0, 'COMMA', 0, 'POINT')} 건|">0 건</div>
            <span class="hint">올해 누적</span>
          </div>
          <div class="col box-wrap">
            <div class="title">UPT</div>
            <div class="card"
                 th:text="|${#numbers.formatDecimal(c.upt, 2, 'COMMA', 2, 'POINT')} 개/건|">0.00 개/건</div>
            <span class="hint">올해 누적</span>
          </div>
          <div class="col box-wrap">
            <div class="title">ADS</div>
            <div class="card"
                 th:text="|${#numbers.formatDecimal(c.ads, 0, 'COMMA', 0, 'POINT')} 원/건|">0 원/건</div>
            <span class="hint">올해 누적</span>
          </div>
        </div>
        <br>
        <div class="row-4">
          <div class="col box-wrap">
            <div class="title">AUR</div>
            <div class="card"
                 th:text="|${#numbers.formatDecimal(c.aur, 0, 'COMMA', 0, 'POINT')} 원/개|">0 원/개</div>
            <span class="hint">올해 누적</span>
          </div>
          <div class="col box-wrap">
            <div class="title">Comp.(MoM)</div>
            <div class="card"
                 th:text="|${#numbers.formatDecimal(c.compMoM, 1, 'COMMA', 1, 'POINT')} %|">0.0 %</div>
            <span class="hint">올해 누적</span>
          </div>
          <div class="col box-wrap">
            <div class="title">Comp.(YoY)</div>
            <div class="card"
                 th:text="|${#numbers.formatDecimal(c.compYoY, 1, 'COMMA', 1, 'POINT')} %|">0.0 %</div>
            <span class="hint">올해 누적</span>
          </div>
          <div class="col box-wrap">
            <div class="title">Order Type Ratio</div>
            <div class="card"
                 th:text="|방문 ${#numbers.formatDecimal(c.visitRatio,1,'COMMA',1,'POINT')}%, 포장 ${#numbers.formatDecimal(c.takeoutRatio,1,'COMMA',1,'POINT')}%, 배달 ${#numbers.formatDecimal(c.deliveryRatio,1,'COMMA',1,'POINT')}%|">
              0%
            </div>
            <span class="hint">올해 누적</span>
          </div>
        </div>
      </div>

      <div class="box-wrap">
        <!-- 검색 영역 -->
        <div id="search" class="search">
          <form id="frm" method="get" onsubmit="return false;">
            <fieldset>
              <legend class="blind">검색</legend>

              <div class="pack-both">

                <div class="pack-left">
                  <label class="fs-ss">가맹점 선택(쉼표로 다중):</label>
                  <input type="text" class="input-text medium form-control" name="storeIds"
                         placeholder="예: 1,2,3 (미입력=전체)"/>
                </div>

                <div class="pack-left">
                  <label class="fs-ss">조회시작일</label>
                  <input type="date" class="input-text medium form-control" name="startDate"
                         th:value="${#temporals.format(search.startDate, 'yyyy-MM-dd')}"/>
                  <label class="fs-ss">조회종료일</label>
                  <input type="date" class="input-text medium form-control" name="endDate"
                         th:value="${#temporals.format(search.endDate, 'yyyy-MM-dd')}"/>
                </div>

                <div class="pack-left">
                  <div class="btn medium bdr-color1 btn-group btn-group-toggle" data-bs-toggle="buttons">
                    <label class="btn medium active">
                      <input type="radio" name="viewBy" value="DAY" checked>일별
                    </label>
                    <label class="btn medium">
                      <input type="radio" name="viewBy" value="MONTH">월별
                    </label>
                  </div>

                  <div class="pack-left page-size">
                    <select title="출력개수" name="limit" class="select medium">
                      <option selected>50</option>
                      <option>100</option>
                      <option>150</option>
                      <option>200</option>
                      <option>250</option>
                      <option>300</option>
                    </select>
                    <span class="fs-ss">개씩 보기</span>
                  </div>

                  <button type="button" class="btn medium color1" onclick="fetchData()">조회</button>
                </div>

              </div>
            </fieldset>
          </form>
        </div>

        <!-- 목록 테이블 -->
        <section class="pack-down">
          <table class="data-table" id="tbl">
            <thead>
            <tr>
              <th>Store</th>
              <th>Sales</th>
              <th>Transaction</th>
              <th>UPT</th>
              <th>ADS</th>
              <th>AUR</th>
              <th>Comp.(MoM)</th>
              <th>Comp.(YoY)</th>
            </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </div>
</div>

<script>
  function params() {
    const fd = new FormData(document.getElementById('frm'));
    const p = new URLSearchParams();
    for (const [k, v] of fd.entries()) {
      if (v !== null && v !== '') p.append(k, v);
    }
    return p.toString();
  }

  function fetchData() {
    fetch('/admin/API/analytics/kpi?' + params())
      .then(r => r.json())
      .then(rows => {
        const tbody = document.querySelector('#tbl tbody');
        tbody.innerHTML = '';
        rows.forEach(r => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${r.storeName ?? ''}</td>
            <td class="ta-r">${r.sales ?? 0}</td>
            <td class="ta-r">${r.transaction ?? 0}</td>
            <td class="ta-r">${r.upt ?? 0}</td>
            <td class="ta-r">${r.ads ?? 0}</td>
            <td class="ta-r">${r.aur ?? 0}</td>
            <td class="ta-r">${r.compMoM ?? 0}</td>
            <td class="ta-r">${r.compYoY ?? 0}</td>`;
          tbody.appendChild(tr);
        });
      })
      .catch(() => toast('데이터 조회 중 오류가 발생했습니다.'));
  }

  // 최초 1회 자동 조회(옵션)
  document.addEventListener('DOMContentLoaded', fetchData);
</script>
</body>
</html>
