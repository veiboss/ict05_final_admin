version: "3.8"

services:
  db:
    image: "mariadb:10.11"
    container_name: "ict05-mariadb"
    environment:
      MARIADB_DATABASE: "ict05final"
      MARIADB_USER: "ictuser"
      MARIADB_PASSWORD: "ictpass123"
      MARIADB_ROOT_PASSWORD: "rootpass123"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - toastlab-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3

  admin-app:
    build: .
    container_name: "ict05-admin-app"
    environment:
      SPRING_PROFILES_ACTIVE: "prod,receive"
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/ict05final
      SPRING_DATASOURCE_USERNAME: ictuser
      SPRING_DATASOURCE_PASSWORD: ictpass123
    expose:
      - "8081"
    depends_on:
      - db
    networks:
      - toastlab-net

  nginx:
    image: nginx:1.27
    container_name: ict05-admin-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - admin-app
    networks:
      - toastlab-net

volumes:
  db_data:

networks:
  toastlab-net:
    name: toastlab-net   # 도커 네트워크 실제 이름을 고정
