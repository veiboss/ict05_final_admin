version: "3.8"

services:
  admin-app:
    build: .
    container_name: ict05-admin-app
    environment:
      # 지금은 dev,receive 프로필로 실행
      - SPRING_PROFILES_ACTIVE=dev,receive
    expose:
      - "8081"

  nginx:
    image: nginx:1.27
    container_name: ict05-admin-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - admin-app
